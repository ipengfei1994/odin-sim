[project]
name = "odin-sim"
version = "0.1.0"
description = "ODIN opinion dynamics simulation and research platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # 与 G3 baseline 锁定同一版本：其 BA 网络与初值生成依赖 numpy PCG64 的随机序列，
    # 版本变化会使 traj_hash 无法与 baseline 数据集对齐。见 docs/baseline-g3-facts.md §5。
    "numpy==2.3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.8,<1.0",
    "httpx>=0.27,<1.0",
]
analysis = [
    "networkx>=3.4,<4.0",
    "scipy>=1.14,<2.0",
    "pandas>=2.2,<4.0",
    "matplotlib>=3.9,<4.0",
]
ui = [
    # Streamlit 起步形态（docs/ui-plan.md §1 选型 A）；plotly 供 explore 页交互渲染。
    "streamlit>=1.40,<2.0",
    "plotly>=5.24,<7.0",
]
web = [
    # 二期 FastAPI 正式服务形态预留（docs/ui-plan.md §1 选型 B）。
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odin_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
